[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-harness"
version = "0.1.0"
description = "AI Coding Harness – Phase 1: GitHub Issue Intake"
requires-python = ">=3.12"
dependencies = [
    "typer==0.12.5",
    "rich==13.9.4",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "anyio==4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "respx==0.21.1",
]

[project.scripts]
harness = "harness.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/harness"]
omit = ["tests/*"]
