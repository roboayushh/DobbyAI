# Trusted, non-secret model profiles. The only credential is AI_API_KEY in the host
# environment; it never appears here. Select a profile with HARNESS_MODEL_PROFILE
# (or the evaluator request's model_config_ref). Every role (planner, coder,
# validator) uses the one selected profile; there is no silent model fallback.
#
# User-owned environment overrides (applied to the selected profile and recorded in
# its fingerprint): HARNESS_MODEL_ENDPOINT, HARNESS_MODEL_NAME,
# HARNESS_MODEL_CONTEXT_WINDOW, HARNESS_MODEL_MAX_OUTPUT_TOKENS,
# HARNESS_MODEL_RESPONSE_FORMAT, HARNESS_MODEL_TIMEOUT_SECONDS, HARNESS_MODEL_TEMPERATURE.
#
# response_format: "json_schema" (strict schema mode), "json_object" (JSON mode; the
# schema travels in the prompt — DeepSeek, Qwen, most vLLM/Ollama servers), or "none".

[profiles.designated]
description = "Placeholder: set endpoint/model (or choose a profile below) before a live run"
protocol = "openai-compatible-chat"
adapter = "openai-compatible"
endpoint = "https://provider.example/v1"
model = "official-model-id"
context_window_tokens = 32000
max_output_tokens = 4000
safety_margin_tokens = 2000
tokenizer = "conservative-v1"
request_timeout_seconds = 120
temperature = 0.0
top_p = 1.0
supports_json_schema = true
allow_streaming = false

